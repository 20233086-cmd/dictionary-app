    <div class="nav__links">
      <a href="index.html" data-nav-link="home" class="nav__link">Tra từ</a><a href="dashboard.html" data-nav-link="dashboard" class="nav__link">Học tập</a><a href="topics.html" data-nav-link="topics" class="nav__link">Chủ đề</a>
      <a href="flashcards.html" data-nav-link="flashcards" class="nav__link">Ôn tập</a>
      <a href="quiz.html" data-nav-link="quiz" class="nav__link">Quiz</a>

    </div>
    <div class="nav__auth" id="nav-auth-slot"></div>
  </div>
</nav>

<main class="container" style="max-width: 620px;">
  <h1 class="page-title">Ôn tập Flashcard</h1>
  <p class="page-subtitle" id="deck-subtitle">Nhớ tốt sẽ được hỏi lại muộn hơn, nhớ kém sẽ được hỏi lại sớm — giống Anki.</p>

  <div id="flashcard-area"></div>
</main>

<!-- Chatbot widget -->
<button class="chat-fab" id="chat-fab" type="button" aria-label="Mở trợ lý AI">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </svg>
</button>
<div class="chat-panel" id="chat-panel">
  <div class="chat-panel__header">
    <div>
      <p class="chat-panel__header-title">Dictly Bot</p>
      <p class="chat-panel__header-sub">Trợ lý học tiếng Anh bằng AI</p>
    </div>
    <button class="chat-panel__close" id="chat-close" type="button" aria-label="Đóng">✕</button>
  </div>
  <div class="chat-panel__body" id="chat-body"></div>
  <div class="chat-panel__footer" id="chat-footer">
    <textarea id="chat-input" rows="1" placeholder="Hỏi Dictly Bot về từ vựng, ngữ pháp, dịch câu..."></textarea>
    <button class="chat-panel__send" id="chat-send" type="button" aria-label="Gửi">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/header.js"></script>
<script src="js/chatbot.js"></script>
<script src="js/flashcards.js"></script>
</body>
</html>
