# ===================================================================

spring.application.name=dictionary-app

# --------------------- SERVER ---------------------
server.port=8080

# --------------------- DATABASE (MySQL) ---------------------
# Tao truoc database bang lenh:  CREATE DATABASE dictionary_db;
spring.datasource.url=jdbc:mysql://localhost:3306/dictionary_db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tu dong tao/cap nhat bang theo Entity (chi nen dung "update" khi phat trien)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --------------------- JWT ---------------------
# Chuoi bi mat de ky JWT - BAT BUOC thay doi khi dua len production, toi thieu 32 ky tu
app.jwt.secret=CHANGE_THIS_SECRET_KEY_TO_SOMETHING_LONG_AND_RANDOM_1234567890
# Thoi gian song cua token: 7 ngay (don vi: mili-giay)
app.jwt.expiration-ms=604800000

# --------------------- GEMINI AI CHATBOT ---------------------
# Lay API key MIEN PHI tai: https://aistudio.google.com/apikey  (khong can the tin dung)
gemini.api.key=KEY-YOU
gemini.api.model=gemini-3.5-flash
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta

# --------------------- UPLOAD / MISC ---------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Tra ve thong bao loi chi tiet hon khi dang phat trien (tat khi len production)
server.error.include-message=always
